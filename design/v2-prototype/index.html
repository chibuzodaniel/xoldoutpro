@supports (height:100dvh){#root>div>div{height:100dvh!important}}

@media (max-width:500px){#root>div>div{max-height:none!important}}

[aria-label="Discover feeds"]::-webkit-scrollbar,[aria-label="Socials feeds"]::-webkit-scrollbar{display:none}
[aria-label="Discover feeds"]>button,[aria-label="Socials feeds"]>button{flex-shrink:0}
/* Inputs in flex rows may shrink (Wallet "Withdraw" was pushed off-screen) */
input,select,textarea{min-width:0}
/* Small phones (iPhone SE 1st gen, older Androids) */
@media (max-width:359px){
 nav[aria-label="Main"]{padding-left:4px!important;padding-right:4px!important}
 nav[aria-label="Main"]>button{min-width:52px!important}
 [aria-label="Discover feeds"]{gap:.5rem}
 [aria-label="Discover feeds"]>button,[aria-label="Socials feeds"]>button{font-size:1rem;padding-left:.375rem;padding-right:.375rem}
 [aria-label="Socials feeds"]>button{margin-right:.25rem}
}
